name: eye_catch
description: "우리 아이 안심 모니터링 Eye Catch 플러터 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0                      # API 통신
  shared_preferences: ^2.2.2        # 토큰 저장
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.5+1
  flutter_launcher_icons: ^0.13.1
  video_player: ^2.11.1             # HLS 스트리밍
  flutter_local_notifications: ^21.0.0
  wifi_iot: ^0.3.18+1          # Wi-Fi 연결/스캔
  multicast_dns: ^0.3.2+5      # mDNS로 브릿지 찾기
  permission_handler: ^11.0.0   # 위치 권한 (Wi-Fi 스캔에 필요)
  pointer_interceptor: ^0.10.1+2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/eyeCatchicon.png"
