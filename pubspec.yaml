name: eye_catch
description: "우리 아이 안심 모니터링 Eye Catch 플러터 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0                      # API 통신
  shared_preferences: ^2.2.2        # 토큰 저장
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.5+1
  flutter_launcher_icons: ^0.13.1
  flutter_local_notifications: ^21.0.0
  permission_handler: ^11.0.0       # BLE / 위치 권한
  pointer_interceptor: ^0.10.1+2    # 웹 빌드에서 영상 위 버튼 클릭 보장
  flutter_blue_plus: ^1.32.12       # BLE 페어링 (브릿지 핫스팟→BLE 마이그레이션)
  gal: ^2.3.0 
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  better_player_enhanced: ^1.0.0    # ← 추가 (네이티브 PiP)

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/eyeCatchicon.png"
dev_dependencies:
  flutter_lints: ^6.0.0
